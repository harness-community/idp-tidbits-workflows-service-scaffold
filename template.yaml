apiVersion: harness.io/v1
kind: Workflow
type: service
identifier: create_new_microservice
name: CreateNewMicroservice
owner: user:nida.ap
spec:
  output:
    links:
      - title: GitHub Repository
        url: ${{ steps.publish.output.remoteUrl }}
        icon: github
      - title: View catalog-info.yaml
        url: ${{ steps.publish.output.repoContentsUrl }}/catalog-info.yaml
        icon: catalog
  parameters:
    - title: Service Details
      required:
        - serviceName
        - description
        - owner
      properties:
        serviceName:
          title: Service Name
          type: string
          description: The display name of the new microservice
          ui:autofocus: true
          ui:help: "Example: Payment Service, User Auth Service"
        description:
          title: Description
          type: string
          description: A short description of what this service does
        owner:
          title: Owner
          type: string
          description: The team or group that owns this service
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
        lifecycle:
          title: Lifecycle
          type: string
          description: The current lifecycle stage of the service
          default: experimental
          enum:
            - experimental
            - production
            - deprecated
          enumNames:
            - Experimental
            - Production
            - Deprecated
    - title: Repository
      required:
        - repoName
      properties:
        repoName:
          title: Repository Name
          type: string
          description: The GitHub repository name (will be created under harness-community)
          ui:help: "Use lowercase with underscores only — no hyphens. Example: payment_service"
  steps:
    # ── Step 1: Fetch skeleton and populate template variables ─────────────────
    - id: fetch
      name: Fetch Skeleton Template
      action: fetch:template
      input:
        url: https://github.com/harness-community/idp-tidbits-workflows-service-scaffold/tree/main/skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          repoName: ${{ parameters.repoName }}
          lifecycle: ${{ parameters.lifecycle }}

    # ── Step 2: Create the GitHub repository ──────────────────────────────────
    - id: publish
      name: Create GitHub Repository
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.description }}
        repoUrl: github.com?owner=harness-community&repo=${{ parameters.repoName }}
        defaultBranch: main
        repoVisibility: public

metadata:
  description: |
    Scaffold a new microservice — creates a GitHub repository with a starter
    structure including catalog-info.yaml for IDP catalog registration.
  tags:
    - recommended
    - service
    - harness
